<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="logoPlatinum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0f2ee"/>
      <stop offset="100%" stop-color="#d2d6ce"/>
    </linearGradient>
    <linearGradient id="logoGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="50%" stop-color="#ffbd35"/>
      <stop offset="100%" stop-color="#d49310"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#080908"/>
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="rgba(255,255,255,0.14)" stroke-width="1.2"/>
  
  <!-- Datum lines -->
  <line x1="8" y1="12" x2="56" y2="12" stroke="rgba(255,255,255,0.22)" stroke-width="0.8" stroke-dasharray="4 3"/>
  <line x1="8" y1="52" x2="56" y2="52" stroke="rgba(255,255,255,0.22)" stroke-width="0.8" stroke-dasharray="4 3"/>
  
  <!-- Calibration precision tick marks at 4 corners -->
  <line x1="8" y1="9" x2="8" y2="15" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>
  <line x1="56" y1="9" x2="56" y2="15" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>
  <line x1="8" y1="49" x2="8" y2="55" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>
  <line x1="56" y1="49" x2="56" y2="55" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>
  
  <!-- G (Platinum Gradient) -->
  <path d="M 23 20 H 13 C 10 20 8 22.5 8 25.5 V 38.5 C 8 41.5 10 44 13 44 H 23 V 33 H 16 V 36.5 H 20 V 39.5 H 13 C 11.5 39.5 10.5 38.5 10.5 37 V 27 C 10.5 25.5 11.5 24.5 13 24.5 H 23 V 20 Z" fill="url(#logoPlatinum)"/>
  
  <!-- I (Gold Gradient Core) -->
  <rect x="28" y="20" width="7" height="24" fill="url(#logoGold)" rx="1"/>
  <line x1="31.5" y1="22" x2="31.5" y2="42" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.45" stroke-linecap="round"/>
  
  <!-- T (Platinum Gradient) -->
  <path d="M 40 20 H 56 V 24.5 H 50 V 44 H 45.5 V 24.5 H 40 V 20 Z" fill="url(#logoPlatinum)"/>
</svg>
